name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4"]
    name: Ruby ${{ matrix.ruby-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      # scampi discovers co-located `__END__` specs with ripgrep.
      - run: sudo apt-get install -y ripgrep

      # Compile Remind into lib/ BEFORE the suite runs. Every spec here opens
      # the library -- that is what a binding is -- so without this the whole
      # run dies at the first `Remind::Session.new` rather than in one spec.
      - run: bundle exec rake compile

      # All three gems' specs: they share one lib/, so they share one run.
      # -Ilib because the converter's specs say `require "remind"`.
      - run: RUBYOPT=-Ilib bundle exec scampi $(grep -rl '^__END__' lib --include='*.rb' | sort)

      - run: bundle exec rubocop
