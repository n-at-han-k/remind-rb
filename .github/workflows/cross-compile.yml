name: Cross Compile

# Cross-compiles Remind into precompiled, per-platform native gems and uploads
# them as build artifacts. This does NOT publish -- releasing is a manual step
# you perform with the built gems, via bin/release-gem.
#
# When users install a published precompiled gem, RubyGems serves the one
# matching their platform (the shared library is already inside), so they need
# no compiler, no make and no ./configure. That is the point: Remind is C, and
# `gem install` should not be a build.
#
# The images are rb-sys's, which are rake-compiler-dock's: one Linux runner
# holds every cross toolchain, so the whole platform set comes out of one job
# each rather than out of whichever runners GitHub still rents. What
# rb-sys-dock runs inside them is
#
#   bundle exec rake native:$RUBY_TARGET gem
#
# which is why the Rakefile has tasks by those names.

on:
  push:
    branches: [main]
    paths:
      - 'ext/**'
      - 'lib/remind/builder.rb'
      - 'lib/remind/library.rb'
      - 'lib/remind/version.rb'
      - 'remind-v*/**'
      - 'remind-rb.gemspec'
      - 'Rakefile'
      - '.github/workflows/cross-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-data:
    name: Fetch CI data
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@v1
        id: fetch
        with:
          supported-ruby-platforms: true

  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
        # Remind is POSIX C -- fork, termios, unistd, glob, sys/inotify -- so
        # the Windows platforms are not a matter of finding a toolchain. There
        # is nothing to build there.
        exclude:
          - platform: x64-mingw32
          - platform: x64-mingw-ucrt
          - platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # rb-sys-dock bind-mounts $HOME/.cargo/registry into the container. The
      # runner image ships rustup, so $HOME/.cargo exists and is chosen -- but
      # nothing has ever put a crate in it, so registry/ does not exist and
      # docker refuses the mount:
      #
      #   invalid mount config for type "bind": bind source path does not
      #   exist: /home/runner/.cargo/registry
      #
      # Rust is not otherwise involved here. This is one empty directory to
      # satisfy a mount for a language this gem does not use.
      - name: Create the cargo registry rb-sys-dock mounts
        run: mkdir -p ~/.cargo/registry

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          # No Rust, so no cargo cache worth cleaning -- and the step that does
          # it downloads a crate binary from a mirror that answers 402.
          cargo-cache-clean: "false"
          # One library per platform, not one per Ruby: nothing here is a Ruby
          # extension. There is no Init_, nothing requires the result, and
          # Fiddle opens it by path -- so the same .so serves every Ruby that
          # can load the gem.
          ruby-versions: "3.4"

      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error
